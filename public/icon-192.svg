<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="gradTomato" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5D42"/>
      <stop offset="60%" stop-color="#E22E1B"/>
      <stop offset="100%" stop-color="#A81508"/>
    </radialGradient>
    <linearGradient id="gradStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#54B83B"/>
      <stop offset="100%" stop-color="#2D7A1E"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#12301A" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="192" height="192" rx="42" fill="#12301A"/>
  
  <!-- Sombra en base -->
  <ellipse cx="96" cy="158" rx="52" ry="12" fill="#0A1C0F" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Patitas -->
    <ellipse cx="72" cy="148" rx="14" ry="12" fill="#C92413"/>
    <ellipse cx="120" cy="148" rx="14" ry="12" fill="#C92413"/>
    
    <!-- Cuerpo de Tomi -->
    <ellipse cx="96" cy="106" rx="60" ry="54" fill="url(#gradTomato)"/>
    
    <!-- Brillo en la cabeza -->
    <ellipse cx="74" cy="78" rx="18" ry="9" fill="#FFFFFF" opacity="0.4" transform="rotate(-18 74 78)"/>
    <ellipse cx="66" cy="72" rx="6" ry="3" fill="#FFFFFF" opacity="0.6" transform="rotate(-18 66 72)"/>

    <!-- Corona de hojas -->
    <g fill="url(#gradStem)">
      <path d="M96 52 C88 32 108 24 114 36 C104 38 100 46 96 52 Z"/>
      <path d="M96 52 C98 34 80 26 72 38 C82 38 90 46 96 52 Z"/>
      <path d="M96 52 C116 46 126 58 116 66 C108 60 102 56 96 52 Z"/>
      <path d="M96 52 C76 46 66 58 76 66 C84 60 90 56 96 52 Z"/>
      <path d="M96 52 C92 68 100 68 96 52 Z"/>
    </g>
    <!-- Tallo -->
    <path d="M93 42 C92 30 99 22 104 18 C106 24 100 32 98 42 Z" fill="#6B4A28"/>

    <!-- Ojos adorables -->
    <g>
      <ellipse cx="78" cy="102" rx="9" ry="11" fill="#1A110E"/>
      <circle cx="81" cy="98" r="3.5" fill="#FFFFFF"/>
      <circle cx="75" cy="106" r="1.5" fill="#FFFFFF"/>
      
      <ellipse cx="114" cy="102" rx="9" ry="11" fill="#1A110E"/>
      <circle cx="117" cy="98" r="3.5" fill="#FFFFFF"/>
      <circle cx="111" cy="106" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- Mejillas sonrojadas -->
    <ellipse cx="63" cy="116" rx="10" ry="6" fill="#FFA5B5" opacity="0.85"/>
    <ellipse cx="129" cy="116" rx="10" ry="6" fill="#FFA5B5" opacity="0.85"/>

    <!-- Sonrisa amigable -->
    <path d="M88 118 Q96 130 104 118" stroke="#1A110E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
